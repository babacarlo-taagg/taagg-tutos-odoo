# Consultant technique Odoo — Bloc 2, leçon 2.2.5 « Lire, créer, modifier, chercher » (fiche 2718).
# Mode terminal. La session odoo-bin shell est interactive : chaque résultat est copié d'une vraie séance sur Odoo 20
# (28/11/2026, base de démonstration du module de référence : deux courses d'Awa Diop, Mermoz 3,5 kg et Rufisque 12 kg),
# dans le même ordre, sans rien changer.
titre: Chercher et modifier des fiches avec l'ORM
sous_titre: Consultant technique Odoo — Bloc 2
mode: terminal
terminal: {utilisateur: awa, machine: baobab}
voix: {moteur: elevenlabs, vitesse: 1.0}
prononciation:
  TAAGG: Tag
  ORM: O R M
  « odoo-bin »: « odoo bine »
  « search_count »: « search count »
  « search_read »: « search read »
  « write »: « ouraïte »
  « Domain »: « Domaine »
  BL/2026/0002: B L 2026, 2
  BL/2026/0001: B L 2026, 1
fin: {message: À toi de jouer !, lien: taagg-school.com}

etapes:
  - chapitre: Le terminal d'Odoo
    texte: >
      « odoo-bin » shell ouvre un terminal Python branché sur ta base. La variable env donne accès à tous les modèles.
    actions:
      - commande: cd ~/odoo && source ~/venv-odoo/bin/activate
      - invite: (venv-odoo) awa@baobab:~/odoo$
      - commande: python3 odoo-bin shell -c ~/baobab/odoo.conf --log-level=warn
        sortie: |
          env: <odoo.orm.environments.Environment object at 0x7f0eced7eb10>
          odoo: <module 'odoo' (namespace) from ['/home/awa/odoo/odoo']>
          openerp: <module 'odoo' (namespace) from ['/home/awa/odoo/odoo']>
          self: res.users(1,)
      - invite: ">>>"
      - commande: C = env["baobab.course"]

  - chapitre: Compter et chercher
    texte: >
      Combien de courses vont dans une zone à au moins 1 500 francs ? « search_count » avec un domaine :
      on traverse la relation zone, point tarif. Réponse : deux.
    actions:
      - commande: C.search_count([("zone_id.tarif", ">=", 1500)])
        sortie: "2"

  - texte: >
      search renvoie un ensemble de fiches, un recordset. Ici, les courses de plus de 5 kilos : une seule, la course numéro 2.
    actions:
      - commande: C.search([("poids", ">", 5)])
        sortie: baobab.course(2,)
      - commande: C.search([("poids", ">", 5)]).name
        sortie: "'BL/2026/0002'"

  - texte: >
      « search_read » cherche et lit en une fois : on obtient une liste de dictionnaires, avec seulement les champs demandés.
    actions:
      - commande: C.search_read([("poids", ">", 5)], ["name", "prix"])
        sortie: "[{'id': 2, 'name': 'BL/2026/0002', 'prix': 4400.0}]"
      - surligner_ligne: "4400.0"
        duree: 2

  - chapitre: Modifier
    texte: >
      Prenons la course numéro 1 : 3 kilos et demi, 1 500 francs. Avec « write », on passe son poids à 7,2 kilos.
    actions:
      - commande: c = C.browse(1)
      - commande: c.name, c.poids, c.prix
        sortie: "('BL/2026/0001', 3.5, 1500.0)"
      - commande: 'c.write({"poids": 7.2})'
        sortie: "True"

  - texte: >
      Le prix est un champ calculé : Odoo l'a recalculé tout seul. 2 100 francs, trois kilos entamés au-delà de cinq.
    actions:
      - commande: c.prix
        sortie: "2100.0"
      - surligner_ligne: "2100.0"
        duree: 2.5

  - chapitre: La classe Domain
    texte: >
      En Odoo 20, on peut aussi construire un domaine avec la classe « Domain », et combiner les conditions avec le symbole et.
      Les deux courses font maintenant plus de 5 kilos, et sont en brouillon.
    actions:
      - commande: from odoo.fields import Domain
      - commande: d = Domain("poids", ">", 5) & Domain("state", "=", "brouillon")
      - commande: print(d)
        sortie: "['&', ('poids', '>', 5), ('state', '=', 'brouillon')]"
      - commande: C.search(d).mapped("name")
        sortie: "['BL/2026/0002', 'BL/2026/0001']"

  - texte: >
      Attention : rien n'est encore enregistré. Pour garder le changement, env point cr point commit. Pour l'annuler, on quitte sans commit.
      À toi de jouer !
    actions:
      - afficher: "env.cr.commit()  ← enregistrer   ·   quitter sans commit ← tout annuler"
      - attendre: 1.5
