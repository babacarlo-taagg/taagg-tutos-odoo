<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../ressources/schema.css"></head><body>
<!-- EB-12 · ce qui rassure une cliente après sa commande -->
<h1>Une cliente rassurée revient<small>quatre outils d'Odoo pour le service client</small></h1>
<div class="rangee">
  <div class="carte"><div class="num">1</div><h2>L'e-mail</h2><p>« votre commande est bien reçue », tout de suite</p></div>
  <div class="carte"><div class="num">2</div><h2>Mon compte</h2><p>ses commandes, ses factures, sans vous appeler</p></div>
  <div class="carte"><div class="num">3</div><h2>Le chat</h2><p>une question ? une réponse en direct</p></div>
  <div class="carte forte"><div class="num">4</div><h2>Les avis</h2><p>les autres clientes donnent confiance</p></div>
</div>
</body></html>
