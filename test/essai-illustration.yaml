# Essai de l'action « illustration » (lancé par npm test, voix muette, brouillon)
titre: Essai illustration
depart: /odoo
etapes:
  - texte: Une image pendant une durée fixe, avec un léger zoom.
    actions:
      - illustration: images/essai-illustration.png
        duree: 1.5
  - texte: Une image qui reste jusqu'à la fin de l'étape, sans zoom.
    actions:
      - illustration: images/essai-illustration.png
        zoom: 1
  - texte: Retour à l'écran Odoo.
    actions:
      - attendre: 0.5
  - texte: Dans l'éditeur de site, on remplace un titre et on ouvre une image.
    actions:
      - aller: /odoo/site
      - remplacer_texte: {dans: 'site >> #wrap h1', texte: Les gâteaux de Maïmouna}
      - double_cliquer: 'site >> #wrap img'
      - surligner: 'site >> #wrap h1'
        duree: 1
      - taper_dans: {dans: '.panneau .recherche', texte: produit}
