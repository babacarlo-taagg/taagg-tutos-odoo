<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Éditeur de site factice</title>
<link rel="stylesheet" href="/style.css">
<style>.o_iframe_container{position:absolute;inset:48px 320px 0 0}.o_iframe_container iframe{width:100%;height:100%;border:0}
.panneau{position:absolute;top:48px;right:0;width:320px;bottom:0;background:#2b2f33;color:#fff;padding:16px}
.panneau input{width:100%;padding:8px}</style></head><body>
<header class="o_navbar"><span class="marque">Éditeur de site (factice, pour tester l'outil)</span></header>
<!-- comme l'appli Site Web d'Odoo : la page du site est dans un cadre, le panneau à droite -->
<div class="o_action_manager"><div class="o_iframe_container"><iframe src="/odoo/site/page.html"></iframe></div></div>
<aside class="panneau"><p>Rechercher un bloc</p><input class="recherche" placeholder="Rechercher un bloc"></aside>
</body></html>
